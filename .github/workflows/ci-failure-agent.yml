name: CI Failure Remediator

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  remediate:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout Failed Commit
        run: |
          git fetch origin
          git checkout ${{ github.event.workflow_run.head_sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mistralai PyGithub requests

      - name: Fetch Failed Workflow Logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts

          gh run view \
            ${{ github.event.workflow_run.id }} \
            --log > artifacts/failure.log

          echo "==== FAILURE LOG PREVIEW ===="
          tail -100 artifacts/failure.log

      - name: Run Diagnosis Agent
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python agent/diagnose.py

      - name: Run Review Agent
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python agent/review.py

      - name: Apply Fix
        run: |
          python agent/apply_fix.py

      - name: Run Validation
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || true
          fi

          if [ -f pytest.ini ] || [ -d tests ]; then
            pytest
          else
            echo "No tests found"
          fi

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python agent/create_pr.py
