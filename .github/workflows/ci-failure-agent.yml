name: CI Failure Agent

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  analyze:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r agent/requirements.txt

      - name: Diagnose
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python agent/diagnose.py

      - name: Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python agent/review.py

      - name: Create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python agent/create_pr.py
